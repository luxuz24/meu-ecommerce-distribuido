name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (ESLint + typescript-eslint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install lint toolchain
        run: npm ci

      - name: Lint services, frontend and scripts
        run: npm run lint

  services:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - catalog-service
          - inventory-service
          - order-service
          - payment-service
          - user-outbox-processor
          - notification-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'services/${{ matrix.service }}/package-lock.json'

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Generate Prisma Client
        if: matrix.service == 'user-service' || matrix.service == 'inventory-service' || matrix.service == 'order-service' || matrix.service == 'payment-service'
        working-directory: services/${{ matrix.service }}
        run: npx prisma generate

      - name: Typecheck / Build
        working-directory: services/${{ matrix.service }}
        run: npm run build

      - name: Run Unit Tests
        working-directory: services/${{ matrix.service }}
        run: npm test

      - name: Audit production dependencies (high/critical fail the build)
        working-directory: services/${{ matrix.service }}
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Build & Test (frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck / Build
        working-directory: frontend
        run: npm run build

      - name: Run Unit Tests
        working-directory: frontend
        run: npm test

      - name: Audit production dependencies (high/critical fail the build)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E Saga (docker compose)
    runs-on: ubuntu-latest
    needs: [lint, services, frontend]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare environment
        run: |
          cp .env.example .env
          # Prazo curto para o teste de caos de expiração de reservas
          echo "RESERVATION_TTL_SECONDS=15" >> .env
          echo "RESERVATION_SWEEP_INTERVAL_MS=2000" >> .env

      - name: Build and start the full stack (waits for every healthcheck)
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Seed demo data through the API gateway
        run: npm run seed:demo

      - name: Run end-to-end saga scenarios
        run: npm run test:e2e

      - name: Chaos test - stuck reservation expires
        run: npm run test:chaos

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
