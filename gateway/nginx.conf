events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 1m;

    # Rate limit zones por IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;

    # Reaproveita o X-Correlation-ID enviado pelo cliente; senão gera um novo por requisição
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    log_format traced '$remote_addr [$time_local] "$request" $status '
                      'cid=$correlation_id upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout traced;

    upstream user_backend {
        least_conn;
        server user-service:3000 max_fails=3 fail_timeout=10s;
    }

    upstream catalog_backend {
        least_conn;
        server catalog-service:3001 max_fails=3 fail_timeout=10s;
    }

    upstream inventory_backend {
        least_conn;
        server inventory-service:3003 max_fails=3 fail_timeout=10s;
    }

    upstream order_backend {
        least_conn;
        server order-service:3004 max_fails=3 fail_timeout=10s;
    }

    upstream payment_backend {
        least_conn;
        server payment-service:3005 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_id;
        # Os serviços também ecoam o header: escondemos o deles para não duplicar
        proxy_hide_header X-Correlation-ID;
        add_header X-Correlation-ID $correlation_id always;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;

        location = /health {
            default_type application/json;
            return 200 '{"status":"up","service":"api-gateway"}';
        }

        # Health de cada serviço exposto pelo gateway (usado pelo painel /architecture)
        location = /health/user      { proxy_pass http://user_backend/health; }
        location = /health/catalog   { proxy_pass http://catalog_backend/health; }
        location = /health/inventory { proxy_pass http://inventory_backend/health; }
        location = /health/order     { proxy_pass http://order_backend/health; }
        location = /health/payment   { proxy_pass http://payment_backend/health; }

        location = /login {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://user_backend;
        }

        location /users {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://user_backend;
        }

        location /api/products {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://catalog_backend;
        }

        location /api/inventory {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://inventory_backend;
        }

        location /api/orders {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://order_backend;
        }

        location /api/payments {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://payment_backend;
        }
    }
}
