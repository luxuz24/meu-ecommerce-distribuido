services:
  postgres:
    image: postgres:15-alpine
    container_name: ecom_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    networks:
      - ecom_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    container_name: ecom_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASS}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - ecom_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ecom_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    ports:
      - "5672:5672"   
      - "15672:15672" 
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecom_network

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - PORT=${PORT}
      - CORS_ORIGINS=${CORS_ORIGINS}
    networks:
      - ecom_network
    depends_on:
      postgres:
        condition: service_healthy
  user-outbox-processor:
    build:
      context: ./services/user-outbox-processor
      dockerfile: Dockerfile
    container_name: user-outbox-processor
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - RABBITMQ_URL=amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672
    networks:
      - ecom_network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started   
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    environment:
      - RABBITMQ_URL=amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672
    networks:
      - ecom_network
    depends_on:
      rabbitmq:
        condition: service_started   

  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: catalog-service
    restart: unless-stopped
    ports:
      - "${CATALOG_PORT:-3001}:${CATALOG_PORT:-3001}"
    environment:
      - PORT=${CATALOG_PORT:-3001}
      - MONGO_URI=mongodb://${MONGO_ADMIN_USER}:${MONGO_ADMIN_PASS}@mongodb:27017/catalog_db?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
    networks:
      - ecom_network
    depends_on:
      - mongodb   

  api-gateway:
    image: nginx:1.27-alpine
    container_name: ecom_api_gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ecom_network
    depends_on:
      - user-service
      - catalog-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: microstore-frontend
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - VITE_USER_API_URL=http://localhost:3000
      - VITE_CATALOG_API_URL=http://localhost:3001
      - VITE_DEV_TELEMETRY=true
    networks:
      - ecom_network
    depends_on:
      - user-service
      - catalog-service

networks:
  ecom_network:
    driver: bridge

volumes:
  pg_data:
  mongo_data:
  rabbitmq_data:
