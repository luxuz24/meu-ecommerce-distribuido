services:
  postgres:
    image: postgres:15-alpine
    container_name: ecom_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: postgres 
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    ports:
      - "5432:5432"
    networks:
      - ecom_network

  mongodb:
    image: mongo:6
    container_name: ecom_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - ecom_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ecom_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: adminpassword
    ports:
      - "5672:5672"   
      - "15672:15672" 
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecom_network

networks:
  ecom_network:
    driver: bridge

volumes:
  pg_data:
  mongo_data:
  rabbitmq_data: